name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  APP_ENV: staging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Projekt einrichten
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV }}"

      - name: Deployment-Ziel anzeigen
        run: |
          echo "Deployment-Ziel: ${{ vars.DEPLOY_TARGET }}"

      - name: Lauf-Informationen anzeigen
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner: ${{ runner.os }}"
        
      - name: Deploy vorbereiten
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy wird vorbereitet"

      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Zugangsdaten prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token-Länge: ${#DEPLOY_TOKEN}"
      
      - name: Tests ausführen
        run: python -m pytest -v --junitxml=test-results.xml
      
      - name: Paket Bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        
      - name: Build-Artifact herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/

      - name: Inhalt prüfen
        run: ls -l build/

      - name: Zugangsdaten prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token-Länge: ${#DEPLOY_TOKEN}"
      
      - name: Deployment-Platzhalter
        run: echo "Deployment für ${{ github.ref_name }}"

      - name: Version ausgeben
        run: |
          echo "Deploying Version: ${{ needs.test.outputs.version }}"

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Automatisches Deployment aus GitHub Actions" \
            build/app.zip